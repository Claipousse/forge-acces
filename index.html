<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connexion · Forge · Gobelin Hurlant</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="gobelin.css">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <style>
    /* styles du login, posés avec les variables du site pour rester dans le ton */
    .forge { max-width: 34rem; margin: 4.5rem auto; }
    .forge .panneau {
      background: var(--relief);
      border: 1px solid var(--trait);
      border-radius: 14px;
      box-shadow: var(--ombre);
      padding: 2.4rem 2.4rem 2.6rem;
    }
    .forge .tag { display: inline-block; font-family: var(--code); font-size: 0.9rem;
      color: var(--nuit); background: var(--morve); padding: 0.25rem 0.65rem; border-radius: 6px; }
    .forge h1 { font-size: 2.1rem; margin: 1.1rem 0 0.4rem; }
    .forge .sous { color: var(--mousse); font-size: 1.1rem; margin: 0 0 2rem; }
    .forge label { display: block; font-size: 1.05rem; color: var(--mousse); margin: 0 0 0.5rem; }
    .forge .bloc { margin: 0 0 1.5rem; }
    .forge input {
      width: 100%; padding: 1rem 1.1rem; border-radius: 10px;
      background: var(--paroi); border: 1px solid var(--trait); color: var(--os);
      font: inherit; font-size: 1.1rem;
    }
    .forge input:focus { outline: 2px solid var(--morve); outline-offset: 2px; border-color: var(--morve); }
    .forge button {
      width: 100%; padding: 1.05rem 1rem; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--morve); color: var(--nuit); font-weight: 800; font-size: 1.2rem;
    }
    .forge button:hover { filter: brightness(1.07); }
    .forge .pied { margin: 1.5rem 0 0; color: var(--mousse); font-size: 0.95rem; }
  </style>
</head>
<body>
  <header class="haut">
    <div class="haut-dedans">
      <a class="marque" href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/index.html"><img src="logo.svg" alt="" width="44" height="44"><span>Gobelin Hurlant</span></a>
      <nav class="menu" aria-label="Menu du site">
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/index.html">Accueil</a>
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/a-propos.html">Le studio</a>
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/equipe.html">La horde</a>
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/organigramme.html">Organigramme</a>
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/offre-emploi.html">On recrute</a>
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/communique.html">Presse</a>
        <a href="https://javakhanstudio.github.io/Entreprises_Fictives/gobelin/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="forge">
      <div class="panneau">
        <span class="tag">forge.gobelin-hurlant.example</span>
        <h1>Connexion à la Forge</h1>

        <form id="form" autocomplete="off">
          <div class="bloc">
            <label for="id">Identifiant</label>
            <input type="text" id="id" name="id" required>
          </div>
          <div class="bloc">
            <label for="mdp">Mot de passe</label>
            <input type="password" id="mdp" name="mdp" required>
          </div>
          <button type="submit">Se connecter</button>
        </form>

        <p class="pied">Accès réservé à la horde. En cas de souci, contactez Ingrid.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
